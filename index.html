<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Documents</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f7fa;
        color: #222;
    }

    header {
        background: #1f2937;
        color: white;
        padding: 20px 40px;
        font-size: 22px;
        font-weight: bold;
    }

    .container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .upload-box {
        background: white;
        border: 2px dashed #9ca3af;
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        margin-bottom: 30px;
    }

    .upload-box h2 {
        margin-bottom: 10px;
    }

    .upload-box p {
        color: #6b7280;
        margin-bottom: 20px;
    }

    .upload-btn {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 12px 22px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .upload-btn:hover {
        background: #1d4ed8;
    }

    #fileInput {
        display: none;
    }

    .files-section {
        background: white;
        border-radius: 12px;
        padding: 25px;
    }

    .files-section h2 {
        margin-bottom: 20px;
    }

    .file {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    .file-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .file-icon {
        font-size: 28px;
    }

    .file-name {
        font-weight: bold;
    }

    .file-size {
        color: #6b7280;
        font-size: 13px;
        margin-top: 4px;
    }

    .actions {
        display: flex;
        gap: 8px;
    }

    .action-btn {
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    .view-btn {
        background: #e0e7ff;
        color: #3730a3;
    }

    .download-btn {
        background: #dcfce7;
        color: #166534;
    }

    .action-btn:hover {
        opacity: 0.8;
    }

    .empty {
        text-align: center;
        color: #9ca3af;
        padding: 30px;
    }

    @media (max-width: 600px) {

        header {
            padding: 18px 20px;
        }

        .container {
            margin-top: 20px;
        }

        .file {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .actions {
            width: 100%;
        }

        .action-btn {
            flex: 1;
        }

    }

</style>


</head>

<body>


<header>
    📁 My Documents
</header>


<div class="container">

    <!-- Upload Section -->

    <div class="upload-box">

        <h2>Upload Document</h2>

        <p>
            Upload your personal documents here
        </p>

        <label for="fileInput" class="upload-btn">
            + Choose File
        </label>

        <input
            type="file"
            id="fileInput"
            onchange="uploadFile()"
        >

    </div>


    <!-- Files Section -->

    <div class="files-section">

        <h2>My Files</h2>

        <div id="fileList">

            <div class="empty">
                No files uploaded yet.
            </div>

        </div>

    </div>

</div>


<script>

    // Store uploaded files temporarily
    let files = [];


    // =========================
    // UPLOAD FILE
    // =========================

    function uploadFile() {

        const input =
            document.getElementById("fileInput");

        const file = input.files[0];

        if (!file) {
            return;
        }

        files.push(file);

        displayFiles();

        // Reset input
        input.value = "";

    }


    // =========================
    // DISPLAY FILES
    // =========================

    function displayFiles() {

        const fileList =
            document.getElementById("fileList");

        fileList.innerHTML = "";


        if (files.length === 0) {

            fileList.innerHTML =
                '<div class="empty">No files uploaded yet.</div>';

            return;

        }


        files.forEach((file, index) => {

            const fileElement =
                document.createElement("div");

            fileElement.className = "file";


            const size =
                formatFileSize(file.size);


            fileElement.innerHTML = `

                <div class="file-info">

                    <div class="file-icon">
                        📄
                    </div>

                    <div>

                        <div class="file-name">
                            ${file.name}
                        </div>

                        <div class="file-size">
                            ${size}
                        </div>

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="action-btn view-btn"
                        onclick="viewFile(${index})">
                        View
                    </button>

                    <button
                        class="action-btn download-btn"
                        onclick="downloadFile(${index})">
                        Download
                    </button>

                </div>

            `;


            fileList.appendChild(fileElement);

        });

    }


    // =========================
    // VIEW FILE
    // =========================

    function viewFile(index) {

        const file = files[index];

        const url =
            URL.createObjectURL(file);

        window.open(url, "_blank");

    }


    // =========================
    // DOWNLOAD FILE
    // =========================

    function downloadFile(index) {

        const file = files[index];

        const url =
            URL.createObjectURL(file);


        const link =
            document.createElement("a");

        link.href = url;

        link.download = file.name;

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    }


    // =========================
    // FILE SIZE
    // =========================

    function formatFileSize(bytes) {

        if (bytes < 1024) {
            return bytes + " Bytes";
        }

        if (bytes < 1024 * 1024) {
            return (bytes / 1024).toFixed(1) + " KB";
        }

        return (bytes / (1024 * 1024)).toFixed(1) + " MB";

    }

</script>
```

</body>

</html>
